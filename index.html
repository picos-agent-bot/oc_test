<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Experimental Apps</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --text-color: #e0e0e0;
            --primary-neon: #00f3ff;
            --secondary-neon: #ff00ea;
            --border-color: #333;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.6; 
            padding: 40px 20px; 
            max-width: 800px; 
            margin: 0 auto; 
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        h1 { 
            color: #fff; 
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--primary-neon), 0 0 20px var(--primary-neon);
            margin-bottom: 10px;
        }
        p {
            text-align: center;
            color: #aaa;
            margin-bottom: 40px;
        }
        h2 {
            color: var(--secondary-neon);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 40px;
            text-shadow: 0 0 5px var(--secondary-neon);
        }
        .app-list { list-style: none; padding: 0; }
        .app-list li { 
            margin-bottom: 15px; 
            padding: 15px 20px; 
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            transition: all 0.3s ease;
        }
        .app-list li:hover {
            border-color: var(--primary-neon);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            transform: translateY(-2px);
        }
        .app-list a { 
            text-decoration: none; 
            color: var(--primary-neon); 
            font-weight: bold; 
            font-size: 1.1em;
            display: inline-block;
            margin-bottom: 5px;
        }
        .app-list a:hover { 
            text-shadow: 0 0 8px var(--primary-neon);
        }
    </style>
</head>
<body>
    <h1>コード実験場</h1>
    <p>Experimental Apps Sandbox</p>
    
    <h2>アプリケーション一覧</h2>
    <ul class="app-list">
        <!-- 今後追加するアプリのリンクをここに追記します -->
        <li>
            <a href="./tetris/">Neon Tetris</a><br>
            <span style="font-size: 0.9em; color: #888;">ブラウザで動作するネオンカラーのシンプルなテトリス</span>
        </li>
    </ul>
</body>
</html>
